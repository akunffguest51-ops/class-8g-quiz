<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CLASS 8G QUIZ</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="desert-bg">
    <div class="dune">
      <svg viewBox="0 0 1440 260" preserveAspectRatio="none">
        <path fill="#1c130c" d="M0,140 C240,200 420,80 700,130 C980,180 1200,90 1440,150 L1440,260 L0,260 Z"/>
        <path fill="#120c07" d="M0,190 C260,230 500,160 760,200 C1040,240 1220,170 1440,210 L1440,260 L0,260 Z"/>
      </svg>
    </div>
  </div>
  <div class="grain"></div>

  <div class="page">
    <div class="brand">
      <div class="icon">🏜️</div>
      <h1>CLASS 8G QUIZ</h1>
      <div class="subtitle">Winning Prizes</div>
    </div>

    <div class="card">
      <p class="lead-text">10 questions. One chance. Think carefully.</p>

      <label for="nickname">Enter your nickname</label>
      <input type="text" id="nickname" maxlength="20" placeholder="cth: Raka" autocomplete="off" />
      <p id="error-msg" style="color:#ff6b5b; font-size:12.5px; margin:8px 0 0; display:none;"></p>

      <button class="btn btn-primary" id="start-btn">START QUIZ →</button>
      <button class="btn btn-secondary" id="leaderboard-btn">🏆 VIEW LEADERBOARD</button>
    </div>

    <p class="footer-note">Setiap pindah tab, keluar halaman, atau copy/paste akan terdeteksi sistem anti-cheat. Kecurangan berulang akan membuat submission didiskualifikasi.</p>
  </div>

  <script src="/app.js"></script>
</body>
</html>
